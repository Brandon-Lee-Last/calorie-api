# Publishes the workout content (exercises and programs) to stage: by hand, or whenever it changes on main.
# Re-running is safe: content is matched by slug and updated in place.
name: Publish content

on:
  workflow_dispatch:
    inputs:
      folder:
        description: Content folder to publish
        default: content/sample
  push:
    branches: [main]
    paths: ['content/**']

permissions:
  contents: read

concurrency:
  group: content-stage
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: stage
    env:
      API_BASE: https://pango-api-stage.lightarch.io
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-content.mjs "${{ inputs.folder || 'content/sample' }}" --publish
