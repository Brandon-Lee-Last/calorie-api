name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: No secrets in the repository
        run: npm run scan:secrets
      - name: Deploy script tests
        run: npm run test:scripts
      - name: Tests (real Workers runtime, real D1) with coverage thresholds
        run: npm run test:coverage
      - name: Known vulnerabilities in what ships (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: The Worker bundles (dry run, no Cloudflare access needed)
        env:
          D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
          API_HOST: ci.example.com
        run: |
          node scripts/render-wrangler.mjs
          npx wrangler deploy --dry-run --config wrangler.rendered.jsonc --env stage --outdir dist
